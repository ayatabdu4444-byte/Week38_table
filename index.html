<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<table id="salary">
    <caption>Employee salary</caption>
    <thead> <!--t head brukes får head til table -->
    <tr>
        <th scope="col">Name</th>
        <th >Position</th>
        <th>Wage</th>
    </tr>

    <!--
       <tr>
           <th scope="row">Name</th>
           <th >Position</th>
           <th>Wage</th>
       </tr>
   -->
    </thead>

    <tbody> <!-- her er data til table som ligger i rad   -->


    <tr>

        <td>John Smith</td>
        <td>Sales Associate </td>
        <td>$15.50 per hour</td>
    </tr>

    <tr>
        <td>Emma Johnson </td>
        <td>Customer Service Representative</td>
        <td>$14.75 per hour</td>
    </tr>

    <tr>
        <td>Michael Brown</td>
        <td> Marketing coordinator</td>
        <td>$18.25 per hour</td>
    </tr>

    <tr>
        <td>Sarah Davis</td>
        <td>IT Support Specialist</td>
        <td>$20.00 per hour</td>
    </tr>

    <tr>
        <td>David Wilson </td>
        <td>Administrative Assistant</td>
        <td> $16.80 per hour</td>
    </tr>

    </tbody>
</table>

</body>
</html>
